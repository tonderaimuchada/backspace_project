<div class="row">
  <div class="col-md-12 col-xl-12">
    <h5 class="mb-3">Customers</h5>
    <div class="mt-4">
      <button type="button" class="btn btn-primary">Add New</button>
    </div>
    <hr>
    <div class="card tbl-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Name</th>
              <th>Surname</th>
              <th>Phone Number</th>
              <th>Email</th>
              <!-- <th class="text-end">TOTAL AMOUNT</th> -->
            </tr>
          </thead>
          <tbody>
            @for (order of recentOrder; track order) {
              <tr>
                <td>
                  <a href="javascript:" class="text-muted">{{ order.id }}</a>
                </td>
                <td>{{ order.name }}</td>
                <td>
                  <span class="d-block">
                    <i class="badge-circle {{ order.status_type }} f-10 m-r-5"></i>
                    {{ order.status }}
                  </span>
                </td>
                <td>{{ order.quantity }}</td>
                <button class="btn btn-primary" data-action="edit">
                  Edit
                </button>
                <button class="btn btn-primary" data-action="delete">
                  Delete
                </button>
                <button class="btn btn-primary" data-action="delete">
                  View Orders
                </button>
                <!-- <td class="text-end">{{ order.amount }}</td> -->
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
